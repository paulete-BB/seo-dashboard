<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SEO · GEO Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js">
// ─── EXPORT / IMPORT CLIENTS ─────────────────────────────────────────────────


// ─── RECOMENDACIONES ──────────────────────────────────────────────────────────
async function loadRec(force=false){
  if(!S.token||!S.id){
    document.getElementById('rec-empty').style.display='block';
    ['rec-loading','rec-error','rec-content','rec-summary-box'].forEach(id=>document.getElementById(id).style.display='none');
    return;
  }
  document.getElementById('rec-s').textContent=`${S.name} · ${S.days} días`;
  // If already has content and not forced, just show it
  if(!force && document.getElementById('rec-content').style.display!=='none') return;

  ['rec-empty','rec-error','rec-content'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('rec-summary-box').style.display='none';
  document.getElementById('rec-loading').style.display='block';
  document.getElementById('rec-loading-txt').textContent='Recopilando datos del cliente…';
  document.getElementById('rec-btn').disabled=true;

  // Gather all available data
  const dataContext = {};

  // SEO data from cache or fresh fetch
  try{
    if(!S.kws.length){
      const d=await gscQ({startDate:ago(S.days+3),endDate:ago(3),dimensions:['query'],rowLimit:25});
      S.kws=d.rows||[];
    }
    const sum=await gscQ({startDate:ago(S.days+3),endDate:ago(3),rowLimit:1});
    const r=sum.rows?.[0]||{};
    dataContext.seo={
      clicks:r.clicks||0, impressions:r.impressions||0,
      ctr:r.ctr?+(r.ctr*100).toFixed(1):0, position:r.position?.toFixed(1)||'—',
      topKeywords:S.kws.slice(0,15).map(k=>({
        query:k.keys[0], pos:+k.position.toFixed(1),
        clicks:k.clicks, ctr:+(k.ctr*100).toFixed(1)
      }))
    };
  }catch(e){dataContext.seo=null;}

  // Conversational queries (AEO proxy)
  try{
    const d=await gscQ({startDate:ago(S.days+3),endDate:ago(3),dimensions:['query'],rowLimit:200});
    const AI_INTENT=/(qué|como|cuál|cuáles|cuánto|cuántos|cuándo|dónde|por qué|mejor|mejores|cómo|diferencia|comparar|recomienda|sirve|funciona|what|how|which|when|where|why|best|difference|compare|recommend|vs)/i;
    dataContext.aeo=(d.rows||[])
      .filter(r=>r.keys[0].trim().split(/\s+/).length>=5||AI_INTENT.test(r.keys[0]))
      .sort((a,b)=>b.impressions-a.impressions).slice(0,10)
      .map(r=>({query:r.keys[0],impressions:r.impressions,ctr:+(r.ctr*100).toFixed(1),pos:+r.position.toFixed(1)}));
  }catch(e){dataContext.aeo=null;}

  // Campaign data from GA4 if available
  const client=clients().find(x=>x.id===S.id);
  if(client?.ga4){
    try{
      const res=await fetch(`https://analyticsdata.googleapis.com/v1beta/properties/${client.ga4}:runReport`,{
        method:'POST',
        headers:{Authorization:`Bearer ${S.token}`,'Content-Type':'application/json'},
        body:JSON.stringify({
          dateRanges:[{startDate:ago(S.days+3),endDate:ago(3)}],
          dimensions:[{name:'sessionCampaignName'}],
          metrics:[{name:'sessions'},{name:'conversions'},{name:'advertiserAdCostPerConversion'},{name:'averageSessionDuration'}],
          dimensionFilter:{orGroup:{expressions:[
            {filter:{fieldName:'sessionMedium',stringFilter:{matchType:'EXACT',value:'cpc',caseSensitive:false}}},
            {filter:{fieldName:'sessionMedium',stringFilter:{matchType:'EXACT',value:'paid',caseSensitive:false}}}
          ]}},
          orderBys:[{metric:{metricName:'sessions'},desc:true}],limit:10
        })
      });
      if(res.ok){
        const d=await res.json();
        dataContext.campaigns=(d.rows||[]).map(r=>({
          name:r.dimensionValues[0].value,
          sessions:+r.metricValues[0].value,
          conversions:+r.metricValues[1].value,
          costPerConv:+r.metricValues[2].value,
          avgDuration:+r.metricValues[3].value
        }));
      }
    }catch(e){dataContext.campaigns=null;}
  }

  document.getElementById('rec-loading-txt').textContent='Analizando con Claude AI…';

  // Build prompt with real data
  const prompt=`Eres un consultor experto en SEO, AEO (Answer Engine Optimization), posicionamiento en IAs y Google Ads.
Analiza los siguientes datos reales del cliente "${S.name}" (${S.url}) para los últimos ${S.days} días y genera recomendaciones específicas y accionables.

DATOS SEO:
${dataContext.seo ? `- Clics: ${dataContext.seo.clicks} | Impresiones: ${dataContext.seo.impressions} | CTR: ${dataContext.seo.ctr}% | Posición media: ${dataContext.seo.position}
- Top keywords: ${dataContext.seo.topKeywords.map(k=>`"${k.query}" pos:${k.pos} clics:${k.clicks} CTR:${k.ctr}%`).join(', ')}` : 'Sin datos SEO disponibles'}

DATOS AEO (queries conversacionales detectadas):
${dataContext.aeo?.length ? dataContext.aeo.map(q=>`"${q.query}" imp:${q.impressions} CTR:${q.ctr}% pos:${q.pos}`).join('
') : 'Sin queries conversacionales detectadas'}

DATOS CAMPAÑAS GOOGLE ADS (via GA4):
${dataContext.campaigns?.length ? dataContext.campaigns.map(c=>`Campaña "${c.name}": ${c.sessions} sesiones, ${c.conversions} conversiones, costo/conv: $${Math.round(c.costPerConv)}, duración sesión: ${Math.round(c.avgDuration)}s`).join('
') : 'Sin datos de campañas o no configurado'}

Responde SOLO en este JSON (sin markdown, sin texto extra):
{
  "resumen": "2-3 oraciones con el estado general del cliente y prioridad principal",
  "seo": [
    {"prioridad": "alta|media|baja", "titulo": "título corto", "recomendacion": "acción concreta y específica basada en los datos"}
  ],
  "aeo": [
    {"prioridad": "alta|media|baja", "titulo": "título corto", "recomendacion": "acción concreta y específica"}
  ],
  "campanas": [
    {"prioridad": "alta|media|baja", "titulo": "título corto", "recomendacion": "acción concreta y específica"}
  ]
}
Genera 3-4 recomendaciones por área. Si no hay datos de un área, genera recomendaciones generales de buenas prácticas para ese tipo de sitio.`;

  try{
    const res=await fetch('https://claude-proxy.paulete.workers.dev',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:2000,
        system:'Eres consultor experto en SEO, AEO y Google Ads para empresas latinoamericanas. Responde siempre en español. Sé específico y accionable, no genérico.',
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await res.json();
    const txt=data.content?.[0]?.text||'';
    let parsed;
    try{parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());}
    catch(e){throw new Error('No se pudo parsear la respuesta. Intenta de nuevo.');}

    // Render summary
    if(parsed.resumen){
      document.getElementById('rec-summary-txt').textContent=parsed.resumen;
      document.getElementById('rec-summary-box').style.display='block';
    }

    const prioColor={'alta':'','media':'blue','baja':'green'};
    const renderItems=(items,containerId)=>{
      const el=document.getElementById(containerId);
      if(!items?.length){el.innerHTML='<div class="rec-item" style="color:var(--gray-400)">Sin recomendaciones para esta área.</div>';return;}
      el.innerHTML=items.map(item=>`
        <div class="rec-item">
          <span class="rec-tag ${prioColor[item.prioridad]||''}">${item.prioridad?.toUpperCase()||'INFO'}</span>
          <strong>${item.titulo}</strong><br>
          ${item.recomendacion}
        </div>`).join('');
    };
    renderItems(parsed.seo,'rec-seo-items');
    renderItems(parsed.aeo,'rec-aeo-items');
    renderItems(parsed.campanas,'rec-camp-items');

    document.getElementById('rec-loading').style.display='none';
    document.getElementById('rec-content').style.display='block';
  }catch(e){
    document.getElementById('rec-loading').style.display='none';
    const errEl=document.getElementById('rec-error');
    errEl.textContent=`⚠ ${e.message}`;
    errEl.style.display='block';
  }
  document.getElementById('rec-btn').disabled=false;
}

</script>
</body>
</html>
